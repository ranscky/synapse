<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse — Trace Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void:       #080808;
            --surface:    #0f0f0f;
            --raised:     #161616;
            --elevated:   #1c1c1c;
            --border:     #242424;
            --border-hi:  #2e2e2e;
            --signal:     #00e5a0;
            --signal-dim: rgba(0, 229, 160, 0.12);
            --signal-mid: rgba(0, 229, 160, 0.4);
            --burn:       #ff6b2b;
            --burn-dim:   rgba(255, 107, 43, 0.12);
            --text-hi:    #e8e8e8;
            --text-mid:   #888;
            --text-lo:    #444;
            --amber:      #f59e0b;
            --cobalt:     #3b82f6;
            --violet:     #8b5cf6;

            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-mono:    'JetBrains Mono', 'Fira Code', monospace;

            --glow-signal: 0 0 8px rgba(0, 229, 160, 0.6), 0 0 24px rgba(0, 229, 160, 0.2);
            --glow-burn:   0 0 8px rgba(255, 107, 43, 0.5), 0 0 20px rgba(255, 107, 43, 0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { height: 100%; }

        body {
            font-family: var(--font-mono);
            background: var(--void);
            color: var(--text-hi);
            line-height: 1.5;
            height: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── SCROLLBAR ─────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--signal); box-shadow: var(--glow-signal); }

        /* ── APP SHELL ─────────────────────────────── */
        .app {
            display: grid;
            grid-template-rows: 56px 1fr;
            min-height: 100vh;
        }

        /* ── TOPBAR ────────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .wordmark {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-hi);
            display: flex;
            align-items: center;
        }

        .wordmark-accent {
            color: var(--signal);
            text-shadow: var(--glow-signal);
        }

        .wordmark-sep {
            color: var(--text-lo);
            font-weight: 300;
            margin: 0 2px;
        }

        .wordmark-sub {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 400;
            color: var(--text-mid);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: 12px;
        }

        .topbar-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        .sys-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            color: var(--text-mid);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--signal);
            box-shadow: var(--glow-signal);
            animation: pulse-beat 2.4s ease-in-out infinite;
        }

        @keyframes pulse-beat {
            0%, 100% { opacity: 1; transform: scale(1); }
            40%       { opacity: 0.3; transform: scale(0.7); }
            60%       { opacity: 1; transform: scale(1.15); }
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-lo);
            letter-spacing: 0.08em;
        }

        /* ── MAIN LAYOUT ───────────────────────────── */
        .workspace {
            display: grid;
            grid-template-columns: 420px 1fr;
            /*grid-template-rows: 1fr 340px;*/
            grid-template-areas:
                "sidebar  playground"
                ;
            gap: 1px;
            background: var(--border);
            height: fill-available;
            overflow: hidden;
        }

        /* ── PANEL BASE ────────────────────────────── */
        .panel {
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel-sidebar    { grid-area: sidebar; }
        .panel-playground { grid-area: playground; }
        .panel-trace      { grid-area: trace; border-top: 1px solid var(--border); }

        .panel-head {
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .panel-label {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--signal);
            text-shadow: var(--glow-signal);
            margin-bottom: 4px;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-hi);
            line-height: 1.2;
        }

        .panel-desc {
            font-size: 11px;
            color: var(--text-mid);
            margin-top: 3px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* ── CORNER DECORATION ─────────────────────── */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-top: 1px solid var(--signal);
            border-left: 1px solid var(--signal);
            opacity: 0.3;
            pointer-events: none;
        }

        /* ── INPUTS ────────────────────────────────── */
        .field { margin-bottom: 14px; }

        .field-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-mid);
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--raised);
            border: 1px solid var(--border);
            color: var(--text-hi);
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 9px 12px;
            outline: none;
            border-radius: 0;
            transition: border-color 0.15s, box-shadow 0.15s;
            -webkit-appearance: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--signal);
            box-shadow: 0 0 0 1px var(--signal), inset 0 0 12px var(--signal-dim);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--text-lo);
        }

        textarea {
            height: 160px;
            resize: vertical;
            line-height: 1.6;
        }

        /* ── BUTTONS ───────────────────────────────── */
        .btn {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            padding: 9px 18px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--signal);
            color: var(--void);
            box-shadow: 0 0 0 0 transparent;
        }

        .btn-primary:hover {
            background: #00ffb3;
            box-shadow: var(--glow-signal);
        }

        .btn-primary:active { transform: scale(0.97); }

        .btn-primary:disabled {
            background: var(--elevated);
            color: var(--text-lo);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-mid);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            border-color: var(--signal);
            color: var(--signal);
        }

        /* ── SIDEBAR: MEMORY LIST ──────────────────── */
        .memory-list { display: flex; flex-direction: column; gap: 6px; }

        .memory-item {
            background: var(--raised);
            border: 1px solid var(--border);
            padding: 11px 13px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
        }

        .memory-item::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: transparent;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .memory-item:hover {
            border-color: var(--border-hi);
            background: var(--elevated);
        }

        .memory-item:hover::after {
            background: var(--signal);
            box-shadow: var(--glow-signal);
        }

        .memory-item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .type-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 0;
        }

        .type-decision  { background: var(--cobalt);  color: #fff; }
        .type-error     { background: var(--burn);     color: #fff; }
        .type-fact      { background: var(--signal);   color: var(--void); }
        .type-preference{ background: var(--amber);    color: var(--void); }
        .type-context   { background: var(--elevated); color: var(--text-mid); border: 1px solid var(--border-hi); }

        .memory-ts {
            font-size: 10px;
            color: var(--text-lo);
        }

        .memory-preview {
            font-size: 11px;
            color: var(--text-mid);
            line-height: 1.5;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ── PLAYGROUND ────────────────────────────── */
        .playground-body {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 16px;
            padding: 16px 20px;
            height: 100%;
            overflow: hidden;
        }

        .playground-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .playground-right {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-left: 1px solid var(--border);
            padding-left: 16px;
            overflow-y: auto;
        }

        .compile-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ── SPINNER ───────────────────────────────── */
        .spinner {
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border-hi);
            border-top-color: var(--signal);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
            box-shadow: 0 0 6px rgba(0, 229, 160, 0.4);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESULTS PANEL ─────────────────────────── */
        .results-label {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-lo);
            margin-bottom: 10px;
        }

        .result-grid {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
        }

        .result-item {
            background: var(--raised);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .result-key {
            font-size: 10px;
            color: var(--text-mid);
            letter-spacing: 0.06em;
        }

        .result-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--signal);
            text-shadow: var(--glow-signal);
        }

        /* ── ERROR ─────────────────────────────────── */
        .error-msg {
            background: var(--burn-dim);
            border: 1px solid var(--burn);
            padding: 10px 13px;
            font-size: 11px;
            color: var(--burn);
            display: none;
        }

        /* ── TRACE PANEL ───────────────────────────── */
        .trace-panel-body {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 0;
            height: 100%;
            overflow: hidden;
        }

        .trace-stats-col {
            border-right: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .trace-main-col {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .stat-block {
            background: var(--raised);
            border: 1px solid var(--border);
            padding: 14px 16px;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--signal);
            text-shadow: var(--glow-signal);
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-name {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-mid);
        }

        .stat-token-bar {
            margin-top: 10px;
            height: 3px;
            background: var(--border);
            position: relative;
            overflow: hidden;
        }

        .stat-token-fill {
            height: 100%;
            background: var(--signal);
            box-shadow: var(--glow-signal);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intent-block {
            background: var(--raised);
            border: 1px solid var(--border);
            padding: 14px 16px;
        }

        .intent-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-lo);
            margin-bottom: 8px;
        }

        .intent-text {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-hi);
            margin-bottom: 10px;
        }

        .confidence-bar {
            height: 3px;
            background: var(--border);
            position: relative;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .confidence-fill {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }

        .confidence-hi   { background: var(--signal); box-shadow: var(--glow-signal); }
        .confidence-med  { background: var(--amber); }
        .confidence-low  { background: var(--burn); box-shadow: var(--glow-burn); }

        .confidence-pct {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-mid);
        }

        /* ── TRACE MEMORY ITEMS ────────────────────── */
        .trace-memory-item {
            background: var(--raised);
            border: 1px solid var(--border);
            margin-bottom: 6px;
            transition: border-color 0.15s;
        }

        .trace-memory-item:hover {
            border-color: var(--border-hi);
        }

        .trace-memory-item.excluded {
            border-color: var(--border);
            opacity: 0.45;
        }

        .trace-mem-head {
            padding: 10px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .trace-mem-left {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .trace-mem-preview {
            font-size: 11px;
            color: var(--text-mid);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .excl-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 2px 7px;
            background: var(--burn-dim);
            color: var(--burn);
            border: 1px solid rgba(255, 107, 43, 0.3);
            flex-shrink: 0;
        }

        .trace-mem-scores {
            padding: 10px 13px 12px;
        }

        /* ── SCORE BAR (the electron-gun sweep) ─────── */
        .score-bar {
            height: 18px;
            background: #111;
            border: 1px solid var(--border);
            display: flex;
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
        }

        .score-seg {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: rgba(0,0,0,0.7);
            width: 0%;
            overflow: hidden;
            white-space: nowrap;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.04em;
        }

        .seg-s { background: #3b82f6; color: rgba(255,255,255,0.8); }
        .seg-r { background: #00e5a0; color: rgba(0,0,0,0.7); box-shadow: inset 0 0 10px rgba(0,229,160,0.3); }
        .seg-i { background: #f59e0b; color: rgba(0,0,0,0.7); }
        .seg-t { background: #8b5cf6; color: rgba(255,255,255,0.8); }

        .score-detail-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .score-cell {
            text-align: center;
        }

        .score-cell-label {
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-lo);
            margin-bottom: 2px;
        }

        .score-cell-val {
            font-size: 11px;
            font-weight: 700;
        }

        .score-cell-val.total { color: var(--text-hi); }
        .score-cell-val.s     { color: #3b82f6; }
        .score-cell-val.r     { color: var(--signal); text-shadow: 0 0 6px rgba(0,229,160,0.5); }
        .score-cell-val.i     { color: var(--amber); }
        .score-cell-val.t     { color: #8b5cf6; }

        /* ── MODAL ─────────────────────────────────── */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            backdrop-filter: blur(4px);
        }

        .modal.open { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border-hi);
            width: 90%;
            max-width: 580px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0, 229, 160, 0.06);
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-head-title {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-mid);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
            transition: color 0.15s;
        }

        .modal-close:hover { color: var(--burn); }

        .modal-content-body {
            padding: 20px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.7;
            color: var(--text-mid);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── EMPTY STATE ───────────────────────────── */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            gap: 10px;
            height: 100%;
        }

        .empty-glyph {
            font-size: 24px;
            color: var(--text-lo);
            line-height: 1;
        }

        .empty-text {
            font-size: 11px;
            color: var(--text-lo);
            letter-spacing: 0.06em;
        }

        /* ── LEGEND ────────────────────────────────── */
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--text-mid);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
        }

        /* ── SCAN LINE AMBIENT (on signal elements only) */
        @keyframes sweep {
            0%   { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .scan-ambient {
            position: relative;
        }
        .scan-ambient::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0, 229, 160, 0.015) 3px,
                rgba(0, 229, 160, 0.015) 4px
            );
            pointer-events: none;
        }

        /* ── RESPONSIVE ────────────────────────────── */
        @media (max-width: 1100px) {
            .workspace {
                grid-template-columns: 280px 1fr;
                grid-template-rows: 1fr 320px;
            }
        }

        @media (max-width: 820px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 360px;
                grid-template-areas:
                    "sidebar"
                    "playground"
                    "trace";
                height: auto;
                overflow: auto;
            }
            .panel { height: auto; min-height: 300px; }
            .panel-trace { height: 360px; }
            .playground-body { grid-template-columns: 1fr; }
            .playground-right { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 14px; }
            .trace-panel-body { grid-template-columns: 1fr; }
            .trace-stats-col { border-right: none; border-bottom: 1px solid var(--border); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ── TOPBAR ── -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="wordmark">
                <span class="wordmark-accent">SYN</span>APSE
                <span class="wordmark-sub">Context Compiler - Trace Inspector</span>
            </div>
            <div class="topbar-divider"></div>
            
        </div>
        <div class="topbar-right">
            <span class="topbar-meta" id="topbarClock"></span>
            <div class="sys-indicator">
                <div class="pulse-dot"></div>
                SYS:ACTIVE
            </div>
            <button class="btn btn-ghost topbar-btn" id="viewSessionBtn">→ VIEW TRACE</button>
        </div>
    </header>

    <!-- ── WORKSPACE ── -->
    <main class="workspace">

        <!-- PANEL 1: SESSION BROWSER -->
        <section class="panel panel-sidebar">
            <div class="panel-head">
                <div>
                    <div class="panel-label">01 — Memory</div>
                    <div class="panel-title">Session Browser</div>
                    <div class="panel-desc">Browse stored memories by session ID</div>
                </div>
            </div>
            <div class="panel-body">
                <div class="field">
                    <label class="field-label" for="sessionIdInput">Session ID</label>
                    <div class="input-row">
                        <input type="text" id="sessionIdInput" placeholder="sess_…" autocomplete="off" spellcheck="false" />
                        <button class="btn btn-primary" id="fetchMemoriesBtn">FETCH</button>
                    </div>
                </div>
                <div class="memory-list" id="memoryList">
                    <div class="empty">
                        <div class="empty-glyph">◈</div>
                        <div class="empty-text">Enter a session ID to load memories</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PANEL 2: COMPILE PLAYGROUND -->
        <section class="panel panel-playground scan-ambient">
            <div class="panel-head">
                <div>
                    <div class="panel-label">02 — Compile</div>
                    <div class="panel-title">Playground</div>
                    <div class="panel-desc">Run the context compilation pipeline</div>
                </div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Semantic</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#00e5a0"></div>Recency</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Importance</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Task</div>
                </div>
            </div>
            <div class="playground-body">
                <div class="playground-left">
                    <div class="field">
                        <label class="field-label" for="messagesJson">Messages JSON Array</label>
                        <textarea id="messagesJson" placeholder='[{"role": "user", "content": "…"}]' spellcheck="false"></textarea>
                    </div>
                    <div class="field">
                        <label class="field-label" for="compileSessionId">Session ID <span style="color:var(--text-lo)">(optional)</span></label>
                        <input type="text" id="compileSessionId" placeholder="sess_…" autocomplete="off" spellcheck="false" />
                    </div>
                    <div class="compile-actions">
                        <button class="btn btn-primary" id="compileBtn">▶ COMPILE</button>
                        <div class="spinner" id="compileSpinner"></div>
                    </div>
                    <div class="error-msg" id="compileError"></div>
                </div>

                <div class="playground-right">
                    <div class="results-label">Output</div>
                    <div id="compileResults">
                        <div class="empty">
                            <div class="empty-glyph">⊡</div>
                            <div class="empty-text">Awaiting compilation</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PANEL 3: TRACE VIEWER
        <section class="panel panel-trace">
            <div class="panel-head">
                <div>
                    <div class="panel-label">03 — Trace</div>
                    <div class="panel-title">Compilation Trace</div>
                    <div class="panel-desc">Memory scoring, intent detection, context decisions</div>
                </div>
            </div>
            <div class="trace-panel-body">
                <div class="trace-stats-col" id="traceStats">
                    <div class="empty" style="padding:24px 0">
                        <div class="empty-glyph">◫</div>
                        <div class="empty-text">No trace yet</div>
                    </div>
                </div>
                <div class="trace-main-col" id="traceContent">
                    <div class="empty">
                        <div class="empty-glyph">◫</div>
                        <div class="empty-text">Compile a session to view trace</div>
                    </div>
                </div>
            </div>
        </section> -->

    </main>
</div>

<!-- MEMORY DETAIL MODAL -->
<div class="modal" id="memoryModal">
    <div class="modal-box">
        <div class="modal-head">
            <span class="modal-head-title">Memory Detail</span>
            <button class="modal-close" id="closeModal">✕</button>
        </div>
        <div class="modal-content-body" id="memoryDetailContent"></div>
    </div>
</div>

<script>
    // ── CLOCK ──────────────────────────────────────
    const clockEl = document.getElementById('topbarClock');
    function updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} UTC${now.getTimezoneOffset() <= 0 ? '+' : ''}${-(now.getTimezoneOffset()/60)}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── VIEW SESSION BUTTON ───────────────────────
    document.getElementById('viewSessionBtn').addEventListener('click', async () => {
        try {
            const res = await fetch('/api/sessions');
            if (!res.ok) throw new Error('request failed');
            const sessions = await res.json();
            if (sessions.length === 0) {
                alert('No live sessions yet — send a request through the proxy first.');
                return;
            }
            window.location.href = `/ui/session?id=${encodeURIComponent(sessions[0].id)}`;
        } catch (e) {
            alert('Could not reach /api/sessions.');
        }
    });

    // ── SESSION BROWSER ────────────────────────────
    const sessionIdInput    = document.getElementById('sessionIdInput');
    const fetchMemoriesBtn  = document.getElementById('fetchMemoriesBtn');
    const memoryList        = document.getElementById('memoryList');

    fetchMemoriesBtn.addEventListener('click', async () => {
        const sessionId = sessionIdInput.value.trim();
        if (!sessionId) {
            sessionIdInput.focus();
            return;
        }
        fetchMemoriesBtn.disabled = true;
        fetchMemoriesBtn.textContent = '…';
        try {
            const response = await fetch(`/v1/memories?session_id=${encodeURIComponent(sessionId)}&limit=20`);
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
            const memories = await response.json();
            displayMemories(memories);
        } catch (error) {
            memoryList.innerHTML = `<div class="error-msg" style="display:block">Error: ${error.message}</div>`;
        } finally {
            fetchMemoriesBtn.disabled = false;
            fetchMemoriesBtn.textContent = 'FETCH';
        }
    });

    function displayMemories(memories) {
        if (!memories || memories.length === 0) {
            memoryList.innerHTML = '<div class="empty"><div class="empty-glyph">◈</div><div class="empty-text">No memories for this session</div></div>';
            return;
        }
        memoryList.innerHTML = memories.map(m => `
            <div class="memory-item" data-memory='${JSON.stringify(m).replace(/'/g, "&#39;")}'>
                <div class="memory-item-head">
                    <span class="type-badge type-${m.memory_type}">${m.memory_type}</span>
                    <span class="memory-ts">${new Date(m.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="memory-preview">${m.content.substring(0, 80)}${m.content.length > 80 ? '…' : ''}</div>
            </div>
        `).join('');

        document.querySelectorAll('.memory-item').forEach(item => {
            item.addEventListener('click', () => {
                const memory = JSON.parse(item.getAttribute('data-memory'));
                showMemoryDetail(memory);
            });
        });
    }

    // ── MODAL ──────────────────────────────────────
    const memoryModal        = document.getElementById('memoryModal');
    const memoryDetailContent= document.getElementById('memoryDetailContent');
    const closeModal         = document.getElementById('closeModal');

    function showMemoryDetail(memory) {
        memoryDetailContent.textContent = JSON.stringify(memory, null, 2);
        memoryModal.classList.add('open');
    }

    closeModal.addEventListener('click', () => memoryModal.classList.remove('open'));
    memoryModal.addEventListener('click', e => { if (e.target === memoryModal) memoryModal.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') memoryModal.classList.remove('open'); });

    // ── COMPILE PLAYGROUND ─────────────────────────
    const messagesJson  = document.getElementById('messagesJson');
    const compileSessionId = document.getElementById('compileSessionId');
    const compileBtn    = document.getElementById('compileBtn');
    const compileSpinner= document.getElementById('compileSpinner');
    const compileError  = document.getElementById('compileError');
    const compileResults= document.getElementById('compileResults');

    messagesJson.value = JSON.stringify([
        { "role": "system",    "content": "You are a helpful assistant." },
        { "role": "user",      "content": "Hello, how are you?" },
        { "role": "assistant", "content": "I'm doing well, thank you for asking! How can I help you today?" },
        { "role": "user",      "content": "Can you explain what Synapse does?" }
    ], null, 2);

    compileBtn.addEventListener('click', async () => {
        const sessionId = compileSessionId.value.trim();
        let messages;

        try {
            messages = JSON.parse(messagesJson.value);
            if (!Array.isArray(messages)) throw new Error('Messages must be an array');
        } catch (parseError) {
            compileError.textContent = `JSON parse error: ${parseError.message}`;
            compileError.style.display = 'block';
            return;
        }

        compileBtn.disabled = true;
        compileSpinner.style.display = 'block';
        compileError.style.display = 'none';

        try {
            const requestBody = { messages, session_id: sessionId || undefined };
            const response = await fetch('/v1/compile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);

            const result = await response.json();
            displayCompileResults(result);
            if (result.trace) displayTrace(result.trace);

        } catch (error) {
            compileError.textContent = `Error: ${error.message}`;
            compileError.style.display = 'block';
        } finally {
            compileBtn.disabled = false;
            compileSpinner.style.display = 'none';
        }
    });

    function displayCompileResults(result) {
        const compiledCount  = result.compiled_messages?.length ?? 0;
        const tokensUsed     = result.trace?.tokens_used     ?? 0;
        const tokenBudget    = result.trace?.token_budget    ?? 0;
        const compileDuration= result.trace?.compile_duration_ms ?? 0;
        const requestId      = result.trace?.request_id      ?? 'N/A';

        compileResults.innerHTML = `
            <div class="result-grid">
                <div class="result-item">
                    <span class="result-key">Compiled msgs</span>
                    <span class="result-val">${compiledCount}</span>
                </div>
                <div class="result-item">
                    <span class="result-key">Tokens used</span>
                    <span class="result-val">${tokensUsed}</span>
                </div>
                <div class="result-item">
                    <span class="result-key">Token budget</span>
                    <span class="result-val">${tokenBudget}</span>
                </div>
                <div class="result-item">
                    <span class="result-key">Duration</span>
                    <span class="result-val">${compileDuration} ms</span>
                </div>
                <div class="result-item">
                    <span class="result-key">Request ID</span>
                    <span class="result-val" style="font-size:10px;letter-spacing:0.04em">${requestId}</span>
                </div>
            </div>
        `;
    }

    // ── TRACE VIEWER ───────────────────────────────
    const traceStats   = document.getElementById('traceStats');
    const traceContent = document.getElementById('traceContent');

    function displayTrace(trace) {
        if (!trace) {
            traceContent.innerHTML = '<div class="empty"><div class="empty-glyph">◫</div><div class="empty-text">No trace data</div></div>';
            return;
        }

        const tokenPct = trace.token_budget > 0 ? (trace.tokens_used / trace.token_budget) * 100 : 0;
        const confPct  = (trace.intent_confidence ?? 0) * 100;
        const confClass= confPct >= 80 ? 'confidence-hi' : confPct >= 50 ? 'confidence-med' : 'confidence-low';

        // Stats column
        traceStats.innerHTML = `
            <div class="stat-block">
                <div class="stat-number">${trace.candidates_retrieved}</div>
                <div class="stat-name">Candidates retrieved</div>
            </div>
            <div class="stat-block">
                <div class="stat-number">${trace.candidates_after_dedup}</div>
                <div class="stat-name">After dedup</div>
            </div>
            <div class="stat-block">
                <div class="stat-number">${trace.memories_compiled}</div>
                <div class="stat-name">Compiled</div>
            </div>
            <div class="stat-block">
                <div class="stat-number" style="font-size:20px">${trace.tokens_used}<span style="font-size:13px;font-weight:400;color:var(--text-lo)">/${trace.token_budget}</span></div>
                <div class="stat-name">Tokens used</div>
                <div class="stat-token-bar">
                    <div class="stat-token-fill" id="tokenFill"></div>
                </div>
            </div>
            <div class="intent-block">
                <div class="intent-label">Detected Intent</div>
                <div class="intent-text">${trace.detected_intent ?? '—'}</div>
                <div class="confidence-bar">
                    <div class="confidence-fill ${confClass}" id="confFill"></div>
                </div>
                <div class="confidence-pct">${confPct.toFixed(1)}% confidence</div>
            </div>
        `;

        // Animate fills after paint
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const tf = document.getElementById('tokenFill');
                const cf = document.getElementById('confFill');
                if (tf) tf.style.width = tokenPct.toFixed(1) + '%';
                if (cf) cf.style.width = confPct.toFixed(1) + '%';
            });
        });

        // Trace memory list
        if (trace.memories && trace.memories.length > 0) {
            traceContent.innerHTML = trace.memories.map(m => renderMemoryTrace(m)).join('');
            // Animate score bars
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.querySelectorAll('.score-seg[data-w]').forEach(el => {
                        el.style.width = el.dataset.w + '%';
                    });
                });
            });
        } else {
            traceContent.innerHTML = '<div class="empty"><div class="empty-glyph">◫</div><div class="empty-text">No memory traces</div></div>';
        }
    }

    function renderMemoryTrace(memory) {
        const total   = memory.score_total || 0.001;
        const sW = ((memory.score_semantic      / total) * 100).toFixed(1);
        const rW = ((memory.score_recency       / total) * 100).toFixed(1);
        const iW = ((memory.score_importance    / total) * 100).toFixed(1);
        const tW = ((memory.score_task_alignment/ total) * 100).toFixed(1);

        return `
            <div class="trace-memory-item${memory.included ? '' : ' excluded'}">
                <div class="trace-mem-head">
                    <div class="trace-mem-left">
                        <span class="type-badge type-${memory.memory_type}">${memory.memory_type}</span>
                        <span class="trace-mem-preview">${memory.content_preview.substring(0, 70)}${memory.content_preview.length > 70 ? '…' : ''}</span>
                    </div>
                    ${!memory.included ? `<span class="excl-badge">${memory.exclusion_reason || 'excluded'}</span>` : ''}
                </div>
                <div class="trace-mem-scores">
                    <div class="score-bar">
                        <div class="score-seg seg-s" data-w="${sW}" style="width:0%">${memory.score_semantic.toFixed(2)}</div>
                        <div class="score-seg seg-r" data-w="${rW}" style="width:0%">${memory.score_recency.toFixed(2)}</div>
                        <div class="score-seg seg-i" data-w="${iW}" style="width:0%">${memory.score_importance.toFixed(2)}</div>
                        <div class="score-seg seg-t" data-w="${tW}" style="width:0%">${memory.score_task_alignment.toFixed(2)}</div>
                    </div>
                    <div class="score-detail-row">
                        <div class="score-cell">
                            <div class="score-cell-label">Total</div>
                            <div class="score-cell-val total">${memory.score_total.toFixed(3)}</div>
                        </div>
                        <div class="score-cell">
                            <div class="score-cell-label">Semantic</div>
                            <div class="score-cell-val s">${memory.score_semantic.toFixed(3)}</div>
                        </div>
                        <div class="score-cell">
                            <div class="score-cell-label">Recency</div>
                            <div class="score-cell-val r">${memory.score_recency.toFixed(3)}</div>
                        </div>
                        <div class="score-cell">
                            <div class="score-cell-label">Importance</div>
                            <div class="score-cell-val i">${memory.score_importance.toFixed(3)}</div>
                        </div>
                        <div class="score-cell">
                            <div class="score-cell-label">Task</div>
                            <div class="score-cell-val t">${memory.score_task_alignment.toFixed(3)}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ── RETRY ──────────────────────────────────────
    async function fetchWithRetry(url, options = {}) {
        const maxRetries = 3;
        let retries = 0;
        while (retries < maxRetries) {
            try {
                const response = await fetch(url, options);
                if (response.status === 429) {
                    const retryAfter = response.headers.get('Retry-After') || 1;
                    await new Promise(r => setTimeout(r, retryAfter * 1000));
                    retries++;
                    continue;
                }
                return response;
            } catch (error) {
                if (retries === maxRetries - 1) throw error;
                retries++;
                await new Promise(r => setTimeout(r, 1000 * retries));
            }
        }
    }
</script>
</body>
</html>
