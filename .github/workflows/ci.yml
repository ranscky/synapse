name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [1.22]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Download dependencies
      run: go mod download

    - name: Install ONNX Runtime (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        curl -L -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
        tar -xzf ort.tgz
        sudo cp onnxruntime-linux-x64-1.27.0/lib/libonnxruntime.so* /usr/local/lib/
        sudo ldconfig

    - name: Install ONNX Runtime (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        curl -L -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-osx-arm64-1.27.0.tgz
        tar -xzf ort.tgz
        sudo cp onnxruntime-osx-arm64-1.27.0/lib/libonnxruntime*.dylib /usr/local/lib/

    - name: Install ONNX Runtime (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-win-x64-1.27.0.zip" -OutFile ort.zip
        Expand-Archive -Path ort.zip -DestinationPath ort
        Copy-Item "ort\onnxruntime-win-x64-1.27.0\lib\onnxruntime.dll" -Destination .
        echo "SYNAPSE_ORT_LIB_PATH=$pwd\onnxruntime.dll" >> $env:GITHUB_ENV

    - name: Download embedding model
      shell: bash
      run: |
        mkdir -p models/all-MiniLM-L6-v2
        # Pinned to commit ca2c6b8 (merged 2024-05-29), the last revision of
        # onnx/model.onnx exported with library='sentence-transformers' via
        # optimum, producing outputs named token_embeddings + sentence_embedding.
        # main's onnx/model.onnx was replaced ~10 months later (commit bc57282,
        # "Add new SentenceTransformer model with an onnx backend") with a
        # differently-structured export that lacks the sentence_embedding
        # output our Go code requires by name -- pinning avoids silently
        # breaking again on the next upstream repo change.
        MODEL_REVISION=ca2c6b84644f6c2f4b7c879851ad9d364ae375f6
        curl -fL -o models/all-MiniLM-L6-v2/model.onnx "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/${MODEL_REVISION}/onnx/model.onnx"
        curl -fL -o models/all-MiniLM-L6-v2/vocab.txt https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/vocab.txt
        curl -fL -o models/all-MiniLM-L6-v2/tokenizer.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
        curl -fL -o models/all-MiniLM-L6-v2/tokenizer_config.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer_config.json
        curl -fL -o models/all-MiniLM-L6-v2/config.json https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/config.json
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Build binary
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          go build -o synapse.exe ./cmd/synapse
        else
          go build -o synapse ./cmd/synapse
        fi
    
    - name: Check binary size
      shell: bash
      run: |
        binary_size=$(du -k synapse | cut -f1)
        if [ $binary_size -gt 51200 ]; then
          echo "Binary size ($binary_size KB) exceeds 50MB limit"
          exit 1
        else
          echo "Binary size ($binary_size KB) is within 50MB limit"
        fi
      if: matrix.os != 'windows-latest'
    
    - name: Check binary size (Windows)
      shell: pwsh
      run: |
        $binary_size = (Get-Item synapse.exe).Length / 1KB
        if ($binary_size -gt 51200) {
          Write-Error "Binary size ($binary_size KB) exceeds 50MB limit"
        } else {
          Write-Output "Binary size ($binary_size KB) is within 50MB limit"
        }
      if: matrix.os == 'windows-latest'
      
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build benchmark tool
      run: go build -o benchmark ./cmd/benchmark
    
    - name: Run benchmark on debug session
      run: ./benchmark testdata/session_debug.json
    
    - name: Run benchmark on code session
      run: ./benchmark testdata/session_code.json

  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22
    
    - name: Smoke test go install
      run: |
        go install ./cmd/synapse
        which synapse
        synapse --help