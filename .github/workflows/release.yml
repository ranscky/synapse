name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
            ort_dir: onnxruntime-linux-x64-1.27.0
            ort_lib: libonnxruntime.so
            ext: ""
            archive_cmd: tar -czf synapse-linux-amd64.tar.gz -C bundle .
            archive_name: synapse-linux-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-osx-arm64-1.27.0.tgz
            ort_dir: onnxruntime-osx-arm64-1.27.0
            ort_lib: libonnxruntime.dylib
            ext: ""
            archive_cmd: tar -czf synapse-darwin-arm64.tar.gz -C bundle .
            archive_name: synapse-darwin-arm64.tar.gz 
          - os: windows-latest
            goos: windows
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-win-x64-1.27.0.zip
            ort_dir: onnxruntime-win-x64-1.27.0
            ort_lib: onnxruntime.dll
            ext: ".exe"
            archive_cmd: Compress-Archive -Path bundle\* -DestinationPath synapse-windows-amd64.zip
            archive_name: synapse-windows-amd64.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.22

    - name: Download dependencies
      run: go mod download

    - name: Fetch ONNX Runtime (unix)
      if: matrix.goos != 'windows'
      shell: bash
      run: |
        curl -L -o ort.tgz "${{ matrix.ort_url }}"
        tar -xzf ort.tgz
        mkdir -p bundle
        cp ${{ matrix.ort_dir }}/lib/${{ matrix.ort_lib }}* bundle/

    - name: Fetch ONNX Runtime (windows)
      if: matrix.goos == 'windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "${{ matrix.ort_url }}" -OutFile ort.zip
        Expand-Archive -Path ort.zip -DestinationPath ort
        New-Item -ItemType Directory -Force -Path bundle
        Copy-Item "ort\${{ matrix.ort_dir }}\lib\${{ matrix.ort_lib }}" -Destination bundle\

    - name: Download embedding model
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bundle/models/all-MiniLM-L6-v2
        # Pinned to commit ca2c6b8 -- main's current onnx/model.onnx was
        # replaced by a different export backend that lacks the
        # sentence_embedding output our embedder requires. Same pin as
        # ci.yml. vocab.txt is fetched fresh too, from the same commit,
        # rather than assumed present in the checkout -- keeps this
        # workflow self-contained and independent of .gitignore state.
        MODEL_REVISION=ca2c6b84644f6c2f4b7c879851ad9d364ae375f6
        curl -fL -o bundle/models/all-MiniLM-L6-v2/model.onnx "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/${MODEL_REVISION}/onnx/model.onnx"
        curl -fL -o bundle/models/all-MiniLM-L6-v2/vocab.txt "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/${MODEL_REVISION}/vocab.txt"

    - name: Build
      shell: bash
      env:
        CGO_ENABLED: 1
      run: go build -ldflags="-s -w" -o bundle/synapse${{ matrix.ext }} ./cmd/synapse

    - name: Copy ui and config
      shell: bash
      run: |
        cp -r ui bundle/ui
        cp README.md bundle/ 2>/dev/null || true
        cp LICENSE bundle/ 2>/dev/null || true
        cp synapse.yaml.example bundle/ 2>/dev/null || true

    - name: Archive
      shell: bash
      run: ${{ matrix.archive_cmd }}
      if: matrix.goos != 'windows'

    - name: Archive (windows)
      shell: pwsh
      run: ${{ matrix.archive_cmd }}
      if: matrix.goos == 'windows'

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          artifacts/**/*.tar.gz artifacts/**/*.zip \
          --title "${{ github.ref_name }}" \
          --generate-notes
    - name: Update Homebrew tap
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        VERSION: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        DARWIN_SHA=$(sha256sum artifacts/synapse-darwin-arm64.tar.gz/synapse-darwin-arm64.tar.gz | cut -d ' ' -f1)
        LINUX_SHA=$(sha256sum artifacts/synapse-linux-amd64.tar.gz/synapse-linux-amd64.tar.gz | cut -d ' ' -f1)

        git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ranscky/homebrew-synapse.git" tap

        # Per-platform block substitution rather than sequential sed calls --
        # matches each url/sha256 pair by which on_macos/on_linux block it
        # sits in, so there's no reliance on line ordering staying stable.
        python3 - "$VERSION" "$DARWIN_SHA" "$LINUX_SHA" <<'PYEOF'
        import re, sys
        version, darwin_sha, linux_sha = sys.argv[1], sys.argv[2], sys.argv[3]
        version_num = version.lstrip("v")
        path = "tap/Formula/synapse.rb"
        content = open(path).read()

        content = re.sub(r'version ".*?"', f'version "{version_num}"', content, count=1)

        content = re.sub(
            r'(url "https://github\.com/ranscky/synapse/releases/download/)v[^/]+(/synapse-darwin-arm64\.tar\.gz"\n\s*sha256 ")[^"]*(")',
            rf'\g<1>{version}\g<2>{darwin_sha}\g<3>',
            content, count=1,
        )
        content = re.sub(
            r'(url "https://github\.com/ranscky/synapse/releases/download/)v[^/]+(/synapse-linux-amd64\.tar\.gz"\n\s*sha256 ")[^"]*(")',
            rf'\g<1>{version}\g<2>{linux_sha}\g<3>',
            content, count=1,
        )

        open(path, "w").write(content)
        PYEOF

        cd tap
        git diff --exit-code -- Formula/synapse.rb && { echo "No changes -- substitution failed to match, aborting"; exit 1; } || true
        git config user.name "synapse-release-bot"
        git config user.email "actions@github.com"
        git add Formula/synapse.rb
        git commit -m "chore: bump synapse to ${VERSION#v}"
        git push origin HEAD